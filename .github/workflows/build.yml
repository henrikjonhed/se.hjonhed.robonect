name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - run: npm i
      - run: npm run build
      - run: npm run format-check
      - run: npm run lint
      - run: npm test
